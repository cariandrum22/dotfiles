model = "gpt-5.6-sol"
review_model = "gpt-5.6-sol"
model_provider = "cloudflare_openai"
model_reasoning_effort = "xhigh"
model_reasoning_summary = "auto"
approval_policy = "never"
default_permissions = ":danger-full-access"

[shell_environment_policy]
inherit = "all"
set = { SHELL = "/bin/bash" }
ignore_default_excludes = false

[shell_environment_policy.filters]
"OPENAI_ORG_ID" = "exclude"
"OPENAI_PROJECT_ID" = "exclude"
"GOOGLE_APPLICATION_CREDENTIALS" = "exclude"
"GOOGLE_OAUTH_CREDENTIALS" = "exclude"
"GCP_SERVICE_ACCOUNT" = "exclude"

[model_providers.cloudflare_openai]
name = "Cloudflare AI Gateway (OpenAI)"
base_url = "https://gateway.ai.cloudflare.com/v1/aaea332100166e675dff4a9ed4012efb/cariandrum22/openai"
env_key = "OPENAI_API_KEY"
wire_api = "responses"

[model_providers.cloudflare_openai.env_http_headers]
cf-aig-authorization = "CF_AIG_TOKEN"
