model = "gpt-5.6-sol"
review_model = "gpt-5.6-sol"
model_provider = "cloudflare_openai"
model_reasoning_effort = "xhigh"
model_reasoning_summary = "auto"
approval_policy = "on-request"
default_permissions = ":danger-full-access"
web_search = "live"

# Use the first-party provider when native search is needed and the gateway
# does not support it. Brave MCP remains available through either provider.
[profiles.openai-search]
model_provider = "openai"
web_search = "live"

[mcp_servers.playwright]
disabled_tools = ["browser_run_code_unsafe", "browser_run_code"]
default_tools_approval_mode = "prompt"

[mcp_servers.chrome-devtools]
default_tools_approval_mode = "prompt"

[mcp_servers.github]
default_tools_approval_mode = "writes"

[mcp_servers.figma]
default_tools_approval_mode = "writes"

[mcp_servers.google-calendar]
enabled = false
default_tools_approval_mode = "writes"

[mcp_servers.google-drive]
enabled = false
default_tools_approval_mode = "writes"

[mcp_servers.google-gmail]
enabled = false
default_tools_approval_mode = "writes"

[mcp_servers.google-personal]
default_tools_approval_mode = "writes"

[mcp_servers.notion]
default_tools_approval_mode = "writes"

[mcp_servers.todoist]
default_tools_approval_mode = "writes"

[mcp_servers.x]
default_tools_approval_mode = "writes"

[shell_environment_policy]
inherit = "all"
set = { SHELL = "/bin/bash" }
ignore_default_excludes = false

[shell_environment_policy.filters]
"OPENAI_ORG_ID" = "exclude"
"OPENAI_PROJECT_ID" = "exclude"
"GOOGLE_APPLICATION_CREDENTIALS" = "exclude"
"GOOGLE_OAUTH_CREDENTIALS" = "exclude"
"GCP_SERVICE_ACCOUNT" = "exclude"

[model_providers.cloudflare_openai]
name = "Cloudflare AI Gateway (OpenAI)"
base_url = "https://gateway.ai.cloudflare.com/v1/aaea332100166e675dff4a9ed4012efb/cariandrum22/openai"
env_key = "OPENAI_API_KEY"
wire_api = "responses"

[model_providers.cloudflare_openai.env_http_headers]
cf-aig-authorization = "CF_AIG_TOKEN"
