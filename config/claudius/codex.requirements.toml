# Codex requirements.toml
# Admin-enforced constraints that users cannot override.
#
# This file mirrors Codex CLI's `requirements.toml` schema.
# See the configuration reference for the latest options:
# https://developers.openai.com/codex/config-reference/
#
# These managed environments use an OS-level sandbox boundary, so Codex may use
# unrestricted local execution without layering its legacy sandbox on top.

allowed_approval_policies = ["untrusted", "on-request", "never", "granular"]
default_permissions = ":danger-full-access"

[allowed_permission_profiles]
":read-only" = true
":workspace" = true
":danger-full-access" = true
